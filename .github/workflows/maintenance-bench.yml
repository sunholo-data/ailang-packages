name: Maintenance bench
on:
  pull_request:
    paths:
      - 'packages/maintenance-bench/**'
      - 'research/real-world-maintenance/taskpacks/v1/**'
      - 'examples/maintenance-ledger-source/**'
      - '.github/workflows/maintenance-bench.yml'
      - 'design_docs/planned/m-maintenance-bench-package-sprint-plan.md'
      - 'design_docs/planned/m-maintenance-eval-foundation-sprint-plan.md'
      - '.ailang/state/sprints/sprint_M-MAINTENANCE-EVAL-FOUNDATION.json'
      - '.ailang/state/sprints/sprint_M-MAINTENANCE-BENCH-PACKAGE.json'
  push:
    branches: [main]
    paths:
      - 'packages/maintenance-bench/**'
      - 'research/real-world-maintenance/taskpacks/v1/**'
      - 'examples/maintenance-ledger-source/**'
      - '.github/workflows/maintenance-bench.yml'
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/maintenance-bench
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned runtime and solver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3 jq
          mkdir -p "$RUNNER_TEMP/maintenance-runtime"
          gh release download v0.54.18 --repo sunholo-data/ailang \
            -p linux.x64.ailang.tar.gz -p SHA256SUMS -D "$RUNNER_TEMP/maintenance-runtime"
          cd "$RUNNER_TEMP/maintenance-runtime"
          sha256sum --ignore-missing -c SHA256SUMS
          tar xzf linux.x64.ailang.tar.gz
          echo "$RUNNER_TEMP/maintenance-runtime" >> "$GITHUB_PATH"
          ./ailang --version
      - name: Compile, native properties, examples, smoke and independent oracle
        run: make verify
      - name: Installed CLI and offline Git/gh integration
        run: make integration
      - name: Strict ledger and independent native task qualification
        run: make ledger-integration qualify-taskpacks source-consumer
      - name: Bounded 1k/10k scale accounting
        run: make scale
      - name: Quality and explicit experimental contract limitation
        run: |
          ailang pkg quality --json . > quality-ci.json
          jq -e '.compile.ok and .tests.failed == 0 and .tests.passed >= 185 and .smoke.passed and (.gates | length == 0)' quality-ci.json
          strict_status=0
          ailang pkg quality --strict --json . > quality-strict-ci.json || strict_status=$?
          jq -e '.compile.ok and .tests.failed == 0 and .tests.passed >= 185 and .smoke.passed and .contracts.counterexample == 0 and .contracts.errors == 0 and .contracts.uncontracted_exports <= 75 and (.gates | all(.code == "PUB011"))' quality-strict-ci.json
          if [ "$strict_status" -ne 0 ]; then
            echo 'Strict quality fails only the documented experimental PUB011 contract-coverage gate (maximum 75 uncontracted exports). It is not reported as a strict pass.'
          fi
          ailang publish --dry-run
      - name: Upload actual quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-quality
          path: packages/maintenance-bench/quality*-ci.json
