[package]
name = "sunholo/audio"
version = "0.3.0"
edition = "1"
ailang = ">=0.54.14"
description = "Deterministic synthesis and checked mono/stereo clips, PCM16/WAV, editing and bounded offline level preparation with block-stable RMS/activity reports and explicit gain policies"
license = "Apache-2.0"

[exports]
modules = ["sunholo/audio/dsp", "sunholo/audio/noise", "sunholo/audio/recipe", "sunholo/audio/pcm", "sunholo/audio/mix", "sunholo/audio/analysis", "sunholo/audio/reference", "sunholo/audio/safety", "sunholo/audio/clip", "sunholo/audio/edit", "sunholo/audio/clip_pcm", "sunholo/audio/levels"]

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["audio", "synthesis", "dsp", "wav", "pcm", "loudness", "games", "procedural"]
ai_summary = "Pure audio processing with typed errors and explicit limits. levels: overflow-resistant full RMS, frame-aligned active-window RMS, sample peaks/full-scale counts, cumulative block budgets, Off/PeakSafe/MatchRms plans with bounded boost and peak protection, checked preparation preserving the immutable original. Not LUFS, true peak, noise identification or automatic microphone gain. clip: validated mono/stereo planar Array[float] and finite headroom. edit: gain, trim, pad, reverse, append, fades, crossfade, bounded mixAt and equal-power pan. clip_pcm: channel-preserving PCM16/WAV with explicit Reject/Saturate and legacy quantization. recipe: deterministic mono synthesis with checked input/frame/layer/work limits. analysis retains legacy gated RMS and seam/low-band checks. Contracts, runtime guards, tests and proofs are distinct evidence. Pure DSP; IO only for smoke. No resampling/device access/dependencies. Existing recipe samples retain pinned bytes."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/audio"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/audio"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # security | fix | feature | breaking — what THIS version changes
