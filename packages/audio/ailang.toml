[package]
name = "sunholo/audio"
version = "0.2.0"
edition = "1"
ailang = ">=0.54.14"
description = "Deterministic mono synthesis and checked mono/stereo audio clips: planar float buffers, channel conversion, editing, panning and mixing, PCM16/WAV import/export, bounded rendering and offline measurements"
license = "Apache-2.0"

[exports]
modules = ["sunholo/audio/dsp", "sunholo/audio/noise", "sunholo/audio/recipe", "sunholo/audio/pcm", "sunholo/audio/mix", "sunholo/audio/analysis", "sunholo/audio/reference", "sunholo/audio/safety", "sunholo/audio/clip", "sunholo/audio/edit", "sunholo/audio/clip_pcm"]

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["audio", "synthesis", "dsp", "wav", "pcm", "loudness", "games", "procedural"]
ai_summary = "Pure audio processing with typed errors and explicit limits. clip: validated mono/stereo planar Array[float], finite headroom, channel selection, interleave/deinterleave, unity mono duplication and average stereo downmix. edit: gain, end-exclusive trim, silence padding, reverse, append, endpoint-defined fades, complementary crossfades, bounded mixAt and equal-power mono panning. clip_pcm: channel-preserving s16le PCM and integer PCM16 WAV import/export with explicit Reject/Saturate clipping policy, legacy-compatible in-range quantization, frame/rate/layout validation and classic RIFF size checks. recipe: existing deterministic mono sine/glide/noise synthesis, filters, envelopes and peak normalization; checked parsing/rendering enforce UTF-8 input, frame, layer and work limits. pcm retains the mono compatibility surface and validates WAV chunks. analysis provides peak, gated RMS and seam/low-band checks, not LUFS. Every new export carries a contract; proof, runtime checks and tests are reported separately. Pure DSP, IO only for smoke. No resampling, device access or third-party package dependencies. Existing recipe samples retain their pinned bytes."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/audio"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/audio"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # security | fix | feature | breaking — what THIS version changes
