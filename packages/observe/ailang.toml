[package]
name = "sunholo/observe"
version = "0.2.0"
edition = "1"
ailang = ">=0.54.18"
description = "Pure observation maths: what reaches an observer, when, and what it means. Light-cone geometry at c = 1 (when light from a static source is seen, signal catch-up on a cruise, link windows for plans relayed via home, the home rate); photon budgets in SI (blackbody photon rate in a band, reflected-light planet contrast, local zodi and exozodi, SNR and integration time, the inner working angle); the radio link budget (SEFD, linkSnr, the radiometer equation and its reach); the mid-infrared excess of waste heat; and a labelled game model of belief, Bayes over eight planet states from detections and non-detections with their false positives"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/observe/lightcone",
  "sunholo/observe/constants",
  "sunholo/observe/photon",
  "sunholo/observe/link",
  "sunholo/observe/wasteheat",
  "sunholo/observe/belief",
]

[dependencies]
"sunholo/relativity" = "0.12.0" # optics.gammaOnePlusBetaCos (the Doppler factor), Vec3; kinematics.oneMinusBeta is the caller's

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["physics", "relativity", "light-cone", "signals", "communication", "astronomy", "photometry", "exoplanets", "seti", "bayes", "games", "simulation"]
ai_summary = "Pure observation geometry in c = 1 units (light-years, years, galaxy frame, home at the origin). lightcone: seenAt(t, obs, src) = t - |obs - src| for a static source; catchUp(delta, oneMinusBeta) = delta / (1 - beta), when a signal sent delta after departure reaches a ship on a straight outbound cruise (pass 1 - beta from sunholo/relativity kinematics.oneMinusBeta); triangleExcess(a, b) = |a| + |b| - |b - a|, >= 0, zero only with b on the far side of home; onBeamLine(port, p, angTol), p on the ray from home through port by an atan2 angle that resolves 1e-8 rad (home and the far side excluded); linkWindow(a, b, legT, covered) = 0 if covered else max(0, |a| + |b| - legT), the wait at b for home's reply to a plan sent from a; earthRate(pos, heading, phi), home-seconds received per ship-second, gamma (1 + beta cos theta) for home's direction via relativity optics.gammaOnePlusBetaCos, -heading at home so leaving reads e^-phi. Check values are stapledons-design relativity-spec RS-26..RS-37. Static sources only: for moving Solar System bodies use sunholo/celestial lighttime. From 0.2.0, in SI with units in every parameter name and check values stapledons-design physics/observation.md OB-1..OB-52: constants (h, c, k, AU, pc, ly, Jy, mas, nominal solar/Earth/Jupiter values, snrHint 5, snrStrong 10); photon: planckPhotonRadiance(tempK, band) by the exact series, photonFlux, photonRate(src, distanceM, apertureM, band, throughput), lambertPhase, planetContrast(geomAlbedo, planetRadiusM, orbitM, phaseRad), zeroMagRate, zodiRate and zodiTotalRate (local zodi + exozodi), backgroundRate, darkRate, snr, timeToSnrS, innerWorkingAngleRad, iwaLimitDistanceM, observable, planetBudget(star, contrast, distanceM, lambda0M, resolvingPower, inst, zodi) -> {signal, background, dark}; link: sefdWm2Hz, linkSnr(eirpW, distanceM, areaM2, bandwidthHz, tSysK) = EIRP/(4 pi d^2 SEFD B), integratedSnr (x sqrt(n_pol B t)), reachM and reachSefdM (the inversion); wasteheat: wasteHeatFactor K(lambda), wasteHeatExcess gamma/(1-gamma) K, wasteHeatFractionFor. belief is a GAME MODEL, every number a design value awaiting review: likelihood(signal, host, state) from one table (10 signals x 8 states x FGK/M hosts, with abiotic O2 on M dwarfs and mineral edges as false positives), confidence(snr) = 1 - 2^-(snr/5)^2 capped at 0.999, posterior(prior, host, observations) -> {p, movedMost, movedBy}: looks at one signal share one fact and saturate, a non-detection counts by the SNR it could have reached, and the result is bit-identical for any order of observations; pLifeCeiling and lifeOddsGainBound state the false-positive bound. The states are sunholo/worlds PlanetState's, by index; no dependency on worlds."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/observe"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/observe"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/packages/observe/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # new modules, nothing removed or changed. security | fix | feature | breaking — what THIS version changes
