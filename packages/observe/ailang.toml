[package]
name = "sunholo/observe"
version = "0.2.0"
edition = "1"
ailang = ">=0.54.18"
description = "Pure observation maths: what reaches an observer, when, and what it means. Light-cone geometry at c = 1 (when light from a static source is seen, signal catch-up on a cruise, link windows for plans relayed via home, the home rate); photon budgets in SI (blackbody photon rate in a band, reflected-light planet contrast, local zodi and exozodi, SNR and integration time, the inner working angle); the radio link budget (SEFD, linkSnr, the radiometer equation and its reach); the mid-infrared excess of waste heat; and a labelled game model of belief, Bayes over eight planet states from detections and non-detections with their false positives"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/observe/lightcone",
  "sunholo/observe/constants",
  "sunholo/observe/photon",
  "sunholo/observe/link",
  "sunholo/observe/wasteheat",
  "sunholo/observe/belief",
]

[dependencies]
"sunholo/relativity" = "0.12.0" # optics.gammaOnePlusBetaCos (the Doppler factor), Vec3; hyper.expm1 (wasteheat); hyper.absf (tests and _smoke); kinematics.oneMinusBeta is the caller's

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["physics", "relativity", "light-cone", "signals", "communication", "astronomy", "photometry", "exoplanets", "seti", "bayes", "games", "simulation"]
ai_summary = "Pure observation maths. lightcone (c = 1, light-years, years, home at the origin): seenAt, catchUp(delta, oneMinusBeta), triangleExcess, onBeamLine, linkWindow, earthRate; check values relativity-spec RS-26..RS-37. From 0.2.0, in SI with the unit in every parameter name and check values stapledons-design physics/observation.md OB-1..OB-52: constants (h, c, k, AU, pc, ly, Jy, mas, snrHint 5, snrStrong 10); photon: photonRate(src, distanceM, apertureM, band, throughput) for a blackbody in a top-hat band, planetContrast(geomAlbedo, planetRadiusM, orbitM, phaseRad), zodiRate (local zodi and exozodi), snr, timeToSnrS, iwaLimitDistanceM, observable, planetBudget -> {signal, background, dark}; link: linkSnr(eirpW, distanceM, areaM2, bandwidthHz, tSysK), integratedSnr, reachM; wasteheat: wasteHeatFactor, wasteHeatExcess, wasteHeatFractionFor. belief is a GAME MODEL, every number a design value awaiting review: likelihood(signal, host, state) from one table (10 signals x 8 planet states x FGK/M hosts, with false positives), confidence(snr), posterior(prior, host, observations) -> {p, movedMost, movedBy}, order-independent, non-detections counted by the SNR they could have reached; pLifeCeiling bounds a false positive. Contracts are checked only under --verify-contracts: validate inputs. See AGENT.md."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/observe"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/observe"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/packages/observe/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # new modules, nothing removed or changed. security | fix | feature | breaking — what THIS version changes
