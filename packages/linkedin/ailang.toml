[package]
name = "sunholo/linkedin"
version = "0.1.1"
edition = "1"
ailang = ">=0.18.0"
description = "LinkedIn API client: OAuth2 auth, publish posts on a company page, read comments, derive GDPR-safe pseudonymous personas for public display."
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/linkedin/auth",
  "sunholo/linkedin/posts",
  "sunholo/linkedin/comments"
]

[effects]
max = ["Net", "FS", "Env"]
