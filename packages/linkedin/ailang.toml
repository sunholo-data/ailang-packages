[package]
name = "sunholo/linkedin"
version = "0.3.0"
edition = "1"
ailang = ">=0.19.0"
description = "LinkedIn API client: OAuth2 auth, publish text + image posts on a company page, read threaded comments, derive GDPR-safe pseudonymous personas for public display."
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/linkedin/auth",
  "sunholo/linkedin/posts",
  "sunholo/linkedin/comments",
  "sunholo/linkedin/images"
]

[effects]
max = ["Net", "FS", "Env", "Declassify"]
