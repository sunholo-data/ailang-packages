[package]
name = "sunholo/billing_service_api"
version = "0.5.9"
edition = "1"
ailang = ">=0.12.1"
description = "HTTP handlers for the billing Cloud Run service — checkout, portal, proposals, webhooks, entitlements"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/billing_service_api/checkout_handler",
  "sunholo/billing_service_api/config_handler",
  "sunholo/billing_service_api/portal_handler",
  "sunholo/billing_service_api/proposal_handler",
  "sunholo/billing_service_api/webhook_handler",
  "sunholo/billing_service_api/entitlements_handler"
]

[dependencies]
"sunholo/billing_entitlements" = { path = "../billing-entitlements" }
"sunholo/billing_proposals" = { path = "../billing-proposals" }
"sunholo/billing_store" = { path = "../billing-store" }
"sunholo/billing_stripe" = { path = "../billing-stripe" }
"sunholo/config" = { path = "../config" }

[effects]
max = ["Net", "FS", "Env", "IO"]

[metadata]
tags = ["billing", "api", "http", "cloud-run"]
ai_summary = "HTTP handlers for billing Cloud Run service. Deploy with 'ailang serve-api'. Checkout, portal, proposals, webhooks, entitlements endpoints."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/billing-service-api"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/billing_service_api"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
