[package]
name = "sunholo/discord"
version = "0.1.0"
edition = "1"
ailang = ">=0.35.0"
description = "Discord REST v10 client: typed messages, safe request construction, pagination and structured errors"
license = "Apache-2.0"
[exports]
modules = ["sunholo/discord/client"]
[effects]
max = ["Net"]
[metadata]
tags = ["discord", "agents", "rest"]
