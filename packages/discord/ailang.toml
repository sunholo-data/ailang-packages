[package]
name = "sunholo/discord"
version = "0.2.1"
edition = "1"
ailang = ">=0.35.0"
description = "Discord REST v10 client: typed messages, safe request construction, pagination, threads, edits, typing and structured errors"
license = "Apache-2.0"
[exports]
modules = ["sunholo/discord/client"]
[effects]
max = ["Net", "IO"]  # IO ceiling serves the _smoke boot gate only; the library surface is Net-only
[metadata]
tags = ["discord", "agents", "rest"]
ai_summary = "Bot REST client: reads, paginated sync, sends, replies, edits, typing and threads. Pure validation/codecs plus one-HTTP-call Net operations. IDs are decimal strings; tokens supplied by caller; no storage or UI dependencies."
