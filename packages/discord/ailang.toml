[package]
name = "sunholo/discord"
version = "0.5.0"
edition = "1"
ailang = ">=0.35.0"
description = "Discord REST v10 client: typed messages, rich embeds with images, safe request construction, pagination, threads, edits, typing and structured errors"
license = "Apache-2.0"
[exports]
modules = ["sunholo/discord/client", "sunholo/discord/interactions"]
[effects]
max = ["Net", "IO"]  # IO ceiling serves the _smoke boot gate only; the library surface is Net-only
[metadata]
repository = "https://github.com/sunholo-data/ailang-packages"
tags = ["discord", "agents", "rest"]
ai_summary = "Bot REST client: reads, paginated sync, sends, replies, edits, typing, threads and rich embeds with images/thumbnails by URL (Discord limit validation enforced). Pure validation/codecs plus one-HTTP-call Net operations. IDs are decimal strings; tokens supplied by caller; no storage or UI dependencies."
