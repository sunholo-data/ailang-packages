[package]
name = "sunholo/social_dynamics"
version = "0.2.0"
edition = "1"
ailang = ">=0.52.0"
description = "Bounded pure social simulation: projects, directed reactions, knowledge, conditions and replayable proposals"
license = "Apache-2.0"
[exports]
modules = ["sunholo/social_dynamics/model", "sunholo/social_dynamics/indicators", "sunholo/social_dynamics/relationships", "sunholo/social_dynamics/tasks", "sunholo/social_dynamics/conditions", "sunholo/social_dynamics/engine", "sunholo/social_dynamics/proposals", "sunholo/social_dynamics/wire"]
[effects]
max = ["IO"] # only private smoke; public API pure
[metadata]
tags = ["simulation", "social", "sandbox", "events"]
ai_summary = "Pure configurable social dynamics with explicit knowledge, atomic proposals, conserved project resources and deterministic single-clock scheduling. No universal score."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/social-dynamics"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "breaking"
