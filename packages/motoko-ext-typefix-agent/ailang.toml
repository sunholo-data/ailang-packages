[package]
name = "sunholo/motoko_ext_typefix_agent"
version = "0.1.0"
edition = "1"
ailang = ">=0.17.0"
description = "Toy A2A sub-agent: suggests fixes for AILANG compile errors. Hosted via `ailang serve-api --a2a`."
license = "Apache-2.0"

[exports]
modules = ["main"]

[dependencies]

[effects]
max = []

[metadata]
tags = ["motoko", "a2a", "agent", "typefix", "ailang"]
ai_summary = "A2A-shaped AILANG agent that proposes minimal patches for AILANG compile-error logs. Pure pattern-matching toy used to validate the wire-a2a-agent end-to-end plumbing in motoko-ext-a2a; pattern for future specialised agents (real type-fixer, contract author, RTG)."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-typefix-agent"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.25

[stability]
level = "experimental"
