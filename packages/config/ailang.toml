[package]
name = "sunholo/config"
version = "0.1.2"
edition = "1"
ailang = ">=0.12.1"
description = "Config loading from environment variables with validation"
license = "Apache-2.0"

[exports]
modules = ["sunholo/config/loader"]

[effects]
max = ["Env"]

[metadata]
tags = ["config", "env", "environment"]
ai_summary = "Load and validate config from environment variables with required/optional/default patterns"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/config"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/config"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
