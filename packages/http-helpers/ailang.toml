[package]
name = "sunholo/http_helpers"
version = "0.1.4"
edition = "1"
ailang = ">=0.12.1"
description = "HTTP request builders, auth headers, JSON response parsing"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/http_helpers/request",
  "sunholo/http_helpers/response"
]

[effects]
max = ["Net"]

[metadata]
tags = ["http", "api", "rest", "json"]
ai_summary = "Build HTTP requests with auth headers, parse JSON responses, standard error handling"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/http-helpers"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/http_helpers"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
