[package]
name = "sunholo/gemini_live"
version = "0.5.0"
edition = "1"
ailang = ">=0.40.0"
description = "Gemini Live API and Gemini TTS on Vertex AI and Google AI Studio — URLs (incl. the global endpoint), setup messages (speech, live avatar, thinking in the right place), audio stream end, parsers for usage, media and transcripts, and batch text-to-speech with a provider-enforced output cap"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/gemini_live/endpoints",
  "sunholo/gemini_live/config",
  "sunholo/gemini_live/messages",
  "sunholo/gemini_live/parsers",
  "sunholo/gemini_live/voices",
  "sunholo/gemini_live/tts"
]

[effects]
max = ["IO"]  # IO for _smoke only; the library modules are pure

[release]
kind = "feature"

[metadata]
tags = ["gemini", "live-api", "websocket", "audio", "streaming", "tts", "avatar", "vertex-ai"]
ai_summary = "Pure protocol helpers for Gemini voice on Vertex AI and AI Studio: Live WebSocket setup (speech with a languageCode such as en-GB, gemini-3.8-live avatars, thinking budget), audio in and audioStreamEnd, parsers for usage by modality, media parts and transcripts, and batch TTS (generateContent) with a provider-enforced maxOutputTokens and a completeness check. Measured against Vertex on 25 Sept 2026."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/gemini-live"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/gemini_live"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
