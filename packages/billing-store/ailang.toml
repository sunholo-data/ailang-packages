[package]
name = "sunholo/billing_store"
version = "0.9.3"
edition = "1"
ailang = ">=0.12.1"
description = "Firestore storage layer for billing records — customers, subscriptions, entitlements, usage, proposals, events"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/billing_store/customers_repo",
  "sunholo/billing_store/subscriptions_repo",
  "sunholo/billing_store/entitlements_repo",
  "sunholo/billing_store/usage_repo",
  "sunholo/billing_store/proposals_repo",
  "sunholo/billing_store/events_repo"
]

[dependencies]
"sunholo/firestore" = { path = "../firestore" }
"sunholo/billing_entitlements" = { path = "../billing-entitlements" }
"sunholo/billing_proposals" = { path = "../billing-proposals" }

[effects]
max = ["IO", "Net", "FS", "Env"]

[metadata]
tags = ["billing", "firestore", "storage", "gcp"]
ai_summary = "Firestore CRUD for billing records: customers, subscriptions, entitlements, usage, proposals, events. Built on sunholo/firestore package."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/billing-store"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/billing_store"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
