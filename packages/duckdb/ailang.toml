[package]
name = "sunholo/duckdb"
version = "0.1.3"
edition = "1"
ailang = ">=0.14.0"
description = "DuckDB query client — execute SQL and parse results via the duckdb CLI"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/duckdb/types",
  "sunholo/duckdb/query",
  "sunholo/duckdb/schema"
]

[effects]
max = ["IO", "Process", "FS"]

[metadata]
tags = ["duckdb", "database", "sql", "analytics", "query"]
ai_summary = "Pure AILANG DuckDB client using std/process. Execute SQL queries against a local .db file, parse JSON results into Json rows (JObjects). No FFI — shells out to the duckdb CLI binary. Includes execScriptFile (ARG_MAX-safe script execution), limitsPrelude (bounded-memory settings), and tryStrptimeChain (deterministic multi-format date parsing that avoids DuckDB's stateful format-list bug)."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/duckdb"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
