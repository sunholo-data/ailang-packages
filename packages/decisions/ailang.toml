[package]
name = "sunholo/decisions"
version = "0.1.2"
edition = "1"
ailang = ">=0.40.0"
description = "Typed decisions from a System One model (TypeSafe Jev via OpenRouter): state + typed questions in, calibrated typed answers with probability distributions out"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/decisions/decide"
]

[effects]
max = ["Net", "Env", "IO"]  # IO serves the _smoke boot probe only; the library surface is Net+Env

[release]
kind = "fix"

[metadata]
tags = ["ai", "decisions", "typesafe", "openrouter", "classification", "confidence"]
ai_summary = "Ask a System One decision model (TypeSafe Jev, via OpenRouter POST /api/alpha/decisions) typed questions about a JSON state: Noul (P(yes)), Choice (categorical + distribution + confidence), Score (ordinal + distribution + confidence). Answers are a closed ADT; gate(answer, minConfidence) is three-way (Act | Escalate | Ungateable) and the package ships NO default threshold. Calls are ! {Net, Env}, non-deterministic (bank the distribution, never argmax alone), and — in this version — outside the AI effect's budget/trace-cost accounting (visible in OpenRouter Broadcast only)."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/decisions"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/decisions"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.50

[stability]
level = "experimental"
