[package]
name = "sunholo/agui"
version = "0.2.1"
edition = "1"
ailang = ">=0.35.0"
description = "Pure AG-UI codecs: event encode/decode, run validation and RunAgentInput request decoding"
license = "Apache-2.0"
[exports]
modules = ["sunholo/agui/events", "sunholo/agui/input"]
[effects]
max = ["IO"]  # IO ceiling serves the _smoke boot gate only; the library surface is pure
[metadata]
repository = "https://github.com/sunholo-data/ailang-packages"
tags = ["agui", "protocol", "agents"]
ai_summary = "Typed AG-UI core subset: event lifecycle, text, tools, state snapshots, CUSTOM with JSONL/SSE encoding, strict decoding and run validation; plus RunAgentInput request decoding (sunholo/agui/input). No network transport."
