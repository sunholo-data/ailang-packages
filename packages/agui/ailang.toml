[package]
name = "sunholo/agui"
version = "0.1.0"
edition = "1"
ailang = ">=0.35.0"
description = "Pure AG-UI event codecs and sequential run validation"
license = "Apache-2.0"
[exports]
modules = ["sunholo/agui/events"]
[effects]
max = ["IO"]  # IO ceiling serves the _smoke boot gate only; the library surface is pure
[metadata]
tags = ["agui", "protocol", "agents"]
ai_summary = "Typed AG-UI core subset: run lifecycle, text, tools, state snapshots, CUSTOM. JSONL and SSE encoding, strict supported-event decoding and sequential trace validation. No network transport."
