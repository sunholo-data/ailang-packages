[package]
name = "sunholo/external_backend"
version = "0.1.0"
edition = "1"
ailang = ">=0.19.0"
description = "Run external subprocess backends that emit JSON; typed Result-based errors with stderr capture."
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/external_backend/runner"
]

[effects]
# Public API (runner.ail) requires only Process. IO is here because the
# _smoke.ail boot probe prints assertion results; consumers of `runJson`
# do not need to opt into IO unless they choose to log via `formatError`.
max = ["Process", "IO"]

[metadata]
tags = ["subprocess", "exec", "json", "ffi", "adapter", "process"]
ai_summary = "Generic wrapper around std/process.exec for JSON-on-stdout backends (PDF parsers, OCR, embedders, classifiers). Returns Result[Json, BackendError] with ExecFailed/NonZeroExit/InvalidJson variants carrying exit code + stderr. Pure formatError helper for logging. Confines the Process effect so callers stay effect-thin."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/external-backend"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/external_backend"
documentation = "https://github.com/sunholo-data/ailang-packages/blob/main/packages/external-backend/README.md"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
