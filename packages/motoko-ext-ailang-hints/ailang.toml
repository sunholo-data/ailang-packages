[package]
name = "sunholo/motoko_ext_ailang_hints"
version = "0.1.0"
edition = "1"
ailang = ">=0.17.0"
description = "Tier-1 motoko extension: conditionally injects AILANG language hints into the system prompt when the task signals AILANG-shaped work. Pairs with microRAG (when available) by pointing the model at search tools for stdlib lookups instead of hallucinating symbols."
license = "Apache-2.0"

[exports]
modules = ["sunholo/motoko_ext_ailang_hints/register"]

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[effects]
max = []

[metadata]
tags = ["motoko", "extension", "ailang", "context-aware", "hints", "microrag"]
ai_summary = "Conditional prompt-patch extension that injects AILANG-specific hints (effect rows, pure func + Z3 contracts, inline tests, microRAG-tools-first stdlib lookups) into motoko's system prompt — but ONLY when ctx.task signals AILANG work (.ail, ailang, pure func, requires/ensures, std/io etc.). Pure substring keyword check; no FS, no per-step cost beyond a strcmp. Pattern-mate of motoko-ext-decision-framework. Sibling demonstration of the context-aware extension pattern; saves prompt budget on Python/JS tasks."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-ailang-hints"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.25

[stability]
level = "experimental"
