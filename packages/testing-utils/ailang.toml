[package]
name = "sunholo/testing_utils"
version = "0.1.1"
edition = "1"
ailang = ">=0.9.2"
description = "Test assertion helpers and data builders"
license = "Apache-2.0"

[exports]
modules = ["sunholo/testing_utils/assertions"]

[effects]
max = []

[metadata]
tags = ["testing", "assertions", "test-utils"]
ai_summary = "Pure assertion helpers for testing: assertEqual, assertContains, assertOk, assertErr"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/testing-utils"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/testing_utils"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
