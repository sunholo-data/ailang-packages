[package]
name = "sunholo/motoko_ext_mcp"
version = "0.1.0"
edition = "1"

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[effects]
max = ["Process", "FS", "Env"]

[exports]
modules = [
  "sunholo/motoko_ext_mcp/register",
  "sunholo/motoko_ext_mcp/mcp",
  "sunholo/motoko_ext_mcp/exec",
  "sunholo/motoko_ext_mcp/resolve",
  "sunholo/motoko_ext_mcp/compress",
  "sunholo/motoko_ext_mcp/types"
]
