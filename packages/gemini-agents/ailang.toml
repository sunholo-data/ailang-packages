[package]
name = "sunholo/gemini_agents"
version = "0.1.0"
edition = "1"
ailang = ">=0.40.0"
description = "Gemini Interactions API agents on Vertex AI (ADC) — Deep Research: start, poll, harvest a cited report, cancel, delete; a proven closed set of agent ids"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/gemini_agents/agents",
  "sunholo/gemini_agents/request",
  "sunholo/gemini_agents/answer",
  "sunholo/gemini_agents/interaction"
]

[dependencies]
"sunholo/gcp_auth" = { path = "../gcp-auth" }

[effects]
max = ["Net", "FS", "Env", "IO"]  # IO for _smoke only; the library modules use Net, FS, Env

[metadata]
tags = ["gemini", "interactions-api", "deep-research", "managed-agents", "vertex-ai"]
ai_summary = "Run Google's Deep Research agent through the Vertex AI Interactions API under ADC: build the background request (with a client nonce as the request's identity), start it, poll its record, read the report and its cited sources, cancel and delete it. The agent ids are a proven closed set."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/gemini-agents"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/gemini_agents"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
