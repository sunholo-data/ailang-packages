[package]
name = "sunholo/celestial"
version = "0.1.0"
edition = "1"
ailang = ">=0.52.0"
description = "Pure solar-system mechanics: Kepler's equation and orbit state vectors, JPL approximate planetary elements (3000 BC-3000 AD, labelled mean-orbit outside) and satellite mean elements on their Laplace planes, ecliptic/equatorial/galactic frames and IAU WGCCRE 2015 poles and rotation"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/celestial/kepler",
  "sunholo/celestial/frames",
  "sunholo/celestial/ephemeris",
]

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["physics", "astronomy", "orbits", "ephemeris", "simulation", "games", "science"]
ai_summary = "Pure celestial mechanics in float64: Kepler's equation (fixed 8-step Newton, residual < 1e-14 for e <= 0.97), position and velocity from Keplerian elements, the JPL Standish approximate planetary elements (Table 2a/2b, 3000 BC-3000 AD; outside it the secular terms freeze at the window edge and a mean-orbit flag is set), JPL satellite mean elements referred to a Laplace plane with apse and node precession, ecliptic J2000 to ICRS (obliquity 84381.406 arcsec) to galactic (Hipparcos 1997 matrix) rotations, and IAU WGCCRE 2015 pole and prime-meridian models. Units AU, days (TDB), km, radians. No dependency on any other package."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/celestial"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/celestial"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # security | fix | feature | breaking — what THIS version changes
