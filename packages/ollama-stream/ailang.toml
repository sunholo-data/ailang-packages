[package]
name = "sunholo/ollama_stream"
version = "0.1.0"
edition = "1"
ailang = ">=0.22.0"
description = "Streaming client for Ollama's NDJSON /api/generate and /api/chat endpoints (thinking-model aware)"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/ollama_stream/client"
]

[effects]
max = ["Stream"]

[metadata]
tags = ["ollama", "llm", "streaming", "ndjson", "thinking", "local"]
ai_summary = "Stream tokens from a local Ollama server line-by-line, surfacing both the answer text and the model's reasoning (for thinking models like gemma4)."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/ollama-stream"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/ollama_stream"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
