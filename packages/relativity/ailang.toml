[package]
name = "sunholo/relativity"
version = "0.2.0"
edition = "1"
ailang = ">=0.45.0"
description = "Pure special and general relativity: exact relativistic motion, trip times, aberration, Doppler colour and brightness, Schwarzschild shadow and deflection"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/relativity/hyper",
  "sunholo/relativity/kinematics",
  "sunholo/relativity/journey",
  "sunholo/relativity/optics",
  "sunholo/relativity/blackbody",
  "sunholo/relativity/photometry",
  "sunholo/relativity/photometry_table",
  "sunholo/relativity/schwarzschild",
]

[effects]
max = ["IO"]  # every export is pure; IO is used only by _smoke.ail to print its verdict

[metadata]
tags = ["physics", "relativity", "simulation", "games", "science", "colour"]
ai_summary = "Pure relativity maths in rapidity form: exact constant-acceleration motion, ship-vs-home trip times (flip-and-burn, burn-coast-burn), aberration and Doppler for a moving observer, blackbody colour and relativistic brightness of stars, main-sequence dwarf photometry from Gaia colour, and closed-form Schwarzschild black-hole values (shadow size, deflection, gravitational shift). Units c = 1, light-years, years."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/relativity"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/relativity"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[stability]
level = "experimental"

[release]
kind = "feature"   # security | fix | feature | breaking — what THIS version changes
