# A starting standard for tagging specifications. Copy it, name its owner, and change it by
# decision: move a rule from proposed to decided and say where it was decided, or drop it.
#
# Rule status:  decided (settled; `source` says where) · proposed (a default, awaiting a decision)
#               · open (no default; someone has to decide)
# `check` switches on a built-in check; a rule without one is guidance. Checks no rule names
# do not run. Built-in check keys: deviations, required, event-name, event-casing, key-casing,
# notation, dictionary, dictionary-fields, ids, priority, versions, history-fields, qa-rounds,
# qa-states, pass-by-person.

standard:
  name: Tagging specification standard
  version: "0.1"
  status: draft
  owner: The standard's owner

rules:
  - {id: owner, status: proposed, source: "specstore default", check: deviations,
     text: "One person owns the standard. A project may differ from it when the owner approves; the difference is recorded in the spec's deviations."}
  - {id: one-source, status: proposed, source: "specstore default",
     text: "Every format a reader gets (sheet, guide, overview) is generated from one source. The format may differ by reader; the content may not."}
  - {id: event-name, status: proposed, source: "specstore default", check: event-name,
     text: "Every event carries an eventName."}
  - {id: event-casing, status: proposed, source: "GA4 event naming", check: event-casing,
     text: "eventName is snake_case. The Tag Manager event value is the same as the eventName."}
  - {id: key-casing, status: proposed, source: "specstore default", check: key-casing,
     text: "dataLayer keys are camelCase, grouped under objects: page.language, user.lastVisit."}
  - {id: notation, status: proposed, source: "specstore default", check: notation,
     text: "A value filled at run time is written {{variableName}}. A fixed value is written as it is."}
  - {id: dictionary, status: proposed, source: "specstore default", check: dictionary,
     text: "Every {{variable}} a spec uses is defined in its dictionary."}
  - {id: dictionary-fields, status: proposed, source: "specstore default", check: dictionary-fields,
     text: "A dictionary entry has a name, a definition, a type, an example and a source. Allowed values when there is a fixed list."}
  - {id: ids, status: proposed, source: "specstore default", check: ids,
     text: "Every event has an ID (a letter and two or three digits), unique and never reused."}
  - {id: required, status: proposed, source: "specstore default", check: required,
     text: "Every event has an ID, a description, a trigger, a scope, an eventName and a priority."}
  - {id: priority, status: proposed, source: "specstore default", check: priority,
     text: "Priority is high, medium or low."}
  - {id: versions, status: proposed, source: "specstore default", check: versions,
     text: "Whole version numbers are what the client receives; internal changes are minor versions; drafts are 0.x. The history only moves forward."}
  - {id: second-reader, status: proposed, source: "specstore default", check: history-fields,
     text: "When someone reads a version second, the history names them."}
  - {id: qa-rounds, status: proposed, source: "specstore default", check: qa-rounds,
     text: "A QA round tests one version and is never overwritten."}
  - {id: qa-states, status: proposed, source: "specstore default", check: qa-states,
     text: "A QA result is a written value: not tested, pass, fail, blocked or not applicable."}
  - {id: pass-by-person, status: proposed, source: "specstore default", check: pass-by-person,
     text: "An automated check may record a failure. Only a person sets a pass."}

vocab:
  qa_states: [not tested, pass, fail, blocked, not applicable]
  priority: [high, medium, low]
  types: [text, number, true/false, list, object]
  statuses: [Internal, Sent to client]

patterns:
  id: "^[A-Z][0-9]{2,3}$"
  event_name: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
  key: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*(\\[\\])?(\\.[a-z][A-Za-z0-9]*)*$"
  variable: "\\{\\{([A-Za-z][A-Za-z0-9]*)\\}\\}"
  other_notation: "\\$[A-Za-z_][A-Za-z0-9_]*|\\[\\[[^\\]]+\\]\\]"

fields:
  spec:
    - {name: client, required: true}
    - {name: project, required: true}
    - {name: owner, required: true, note: "The analyst responsible for the spec"}
    - {name: version, required: true, note: "The last row of the history"}
    - {name: standard, required: true, note: "The standard version this spec follows"}
    - {name: deviations, required: false, note: "rule, instead, approved_by"}
  event:
    - {name: id, required: true}
    - {name: description, required: true, note: "What the user does, in business words"}
    - {name: trigger, required: true}
    - {name: scope, required: true, note: "The page, template or flow"}
    - {name: eventName, required: true}
    - {name: priority, required: true}
    - {name: parameters, required: false, note: "key and value; the value is fixed or a {{variable}}"}
    - {name: since, required: true, note: "The version that added it"}
    - {name: changed, required: false, note: "The last version that changed it"}
    - {name: note, required: false}
  dictionary:
    - {name: name, required: true}
    - {name: definition, required: true}
    - {name: type, required: true}
    - {name: example, required: true}
    - {name: source, required: true}
    - {name: allowed, required: false}
  history:
    - {name: version, required: true}
    - {name: date, required: true}
    - {name: author, required: true}
    - {name: what, required: true}
    - {name: second_reader, required: false}
    - {name: status, required: true}
  qa_round:
    - {name: round, required: true}
    - {name: version, required: true}
    - {name: date, required: true}
    - {name: tester, required: true}
    - {name: by, required: true, note: "person or automated"}
    - {name: results, required: true, note: "event, state, comment"}
