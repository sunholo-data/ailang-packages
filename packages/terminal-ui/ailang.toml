[package]
name = "sunholo/terminal_ui"
version = "0.1.0"
edition = "1"
ailang = ">=0.52.0"
description = "Pure safe terminal layout and paged screens with an independent IO showcase"
license = "Apache-2.0"
[exports]
modules = ["sunholo/terminal_ui/ui"]
[effects]
max = ["IO"]
[bin]
terminal-ui-demo = {module = "demo",entry = "main",caps = "IO"}
[metadata]
ai_summary = "Experimental pure control sanitizing, conservative cell measurement, wrapping, dimensions, gauges and deterministic ANSI/plain screen paging; line-input IO demo"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/terminal-ui"
[release]
kind = "feature"
[stability]
level = "experimental"
