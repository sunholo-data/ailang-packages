[package]
name = "sunholo/deontic"
version = "0.2.0"
edition = "1"
ailang = ">=0.28.0"
description = "Verified deontic reasoning engine: obligations, notice-and-cure, waiver, suspension, force majeure, attributed delay, amendment, termination — a pure event fold with Z3-contracted settlement arithmetic, per-diem or period interest, and earned money that survives termination"
license = "Apache-2.0"

[exports]
modules = ["sunholo/deontic/types", "sunholo/deontic/settle", "sunholo/deontic/engine", "sunholo/deontic/api"]

[effects]
max = ["IO"]  # exports are all pure; IO is used only by the wave5_demo gate — shrinking this to [] makes even the demo println fail at the manifest ceiling

[metadata]
tags = ["contracts", "deontic", "legal", "verification", "z3"]
ai_summary = "Pure contract-reasoning engine (obligations, cure windows, waivers, suspension/resume, force majeure, attributed delay, termination cascade) with Z3-provable settlement math including per-diem statutory interest; outstanding principal is reported and survives termination; consumers supply events and print the report under their own capabilities"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/deontic"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/deontic"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
