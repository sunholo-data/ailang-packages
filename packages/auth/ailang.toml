[package]
name = "sunholo/auth"
version = "0.4.1"
edition = "1"
ailang = ">=0.9.5"
description = "API key validation via hash comparison, bearer token extraction"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/auth/keys",
  "sunholo/auth/bearer"
]

[effects]
max = []

[metadata]
tags = ["auth", "security", "api-key", "bearer"]
ai_summary = "Pure API key validation (SHA-256 hash comparison, constant-time) and bearer token extraction"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/auth"
homepage = "https://ailang.sunholo.com/docs/packages/sunholo/auth"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

# Per-cascade AI repair budget ceiling (USD). The cloud wrapper aborts
# the run and labels the PR `cascade-budget-exceeded` rather than overrunning.
# Tune up for packages with deeply-coupled consumers; tune down for
# trivial ones. Default $1.00 leaves ~17x headroom over the observed
# test_pkg signature-change repair ($0.058).
[cascade]
max_cost_usd = 1.00

[stability]
level = "experimental"
