[package]
name = "sunholo/worlds"
version = "0.2.1"
edition = "1"
ailang = ">=0.56.1"
description = "Pure cited astrobiology priors, anthropic dial, exponential-disc counts, planet occurrence, immutable histories from supplied uniforms, and the prediction of a world's state after an interval."
license = "Apache-2.0"
[exports]
modules = ["sunholo/worlds/baseline", "sunholo/worlds/dial", "sunholo/worlds/disc", "sunholo/worlds/occurrence", "sunholo/worlds/history", "sunholo/worlds/planet_model", "sunholo/worlds/epoch_statistics", "sunholo/worlds/propagate"]
[dependencies]
"sunholo/celestial" = "0.7.0"
[effects]
max = ["IO"]
[metadata]
tags = ["astronomy", "astrobiology", "drake", "population", "simulation", "science"]
ai_summary = "Pure baseline-2026.11 uncertainty priors (Sandberg rate model for life), effective anthropic luck after probability saturation, local exponential-disc Drake counts, SAG13 occurrence and stateAt histories. propagate moves a belief over the eight planet states forward in years: a constant-rate Markov chain (transitionRates, propagate) and the history sampler's exact conditional law (historyKernel, propagateExact). No RNG or I/O in public modules; years, light-years and Earth units. Distinguishes adopted assumptions from measured values."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/worlds"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "fix"
