[package]
name = "sunholo/worlds"
version = "0.1.0"
edition = "1"
ailang = ">=0.56.1"
description = "Pure cited astrobiology priors, anthropic dial, exponential-disc counts, planet occurrence and immutable histories from supplied uniforms."
license = "Apache-2.0"
[exports]
modules = ["sunholo/worlds/baseline", "sunholo/worlds/dial", "sunholo/worlds/disc", "sunholo/worlds/occurrence", "sunholo/worlds/history", "sunholo/worlds/planet_model", "sunholo/worlds/epoch_statistics"]
[dependencies]
"sunholo/celestial" = "0.6.0"
[effects]
max = ["IO"]
[metadata]
tags = ["astronomy", "astrobiology", "drake", "population", "simulation", "science"]
ai_summary = "Pure baseline-2026.11 uncertainty priors (Sandberg rate model for life), effective anthropic luck after probability saturation, local exponential-disc Drake counts, SAG13 occurrence and stateAt histories. No RNG or I/O in public modules; years, light-years and Earth units. Distinguishes adopted assumptions from measured values."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/worlds"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "feature"
