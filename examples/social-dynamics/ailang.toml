[package]
name = "sunholo/social_experiments"
version = "0.1.0"
edition = "1"
ailang = ">=0.52.0"
description = "Standalone social dynamics experiments"
license = "Apache-2.0"
[exports]
modules = ["sunholo/social_experiments/config", "sunholo/social_experiments/session"]
[dependencies]
"sunholo/social_dynamics" = {path = "../../packages/social-dynamics"}
[effects]
max = ["IO"]
[bin]
social-lab = { module = "main", entry = "main", caps = "IO" }
[metadata]
ai_summary = "Recorded social experiment runner; ship and community policies with causal traces, no game or AI calls"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/examples/social-dynamics"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "feature"
