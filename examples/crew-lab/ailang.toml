[package]
name = "sunholo/crew_lab"
version = "0.7.0"
edition = "1"
ailang = ">=0.54.0"
description = "Local captain/crew lab on sunholo/crew_core: terminal watch, AI dialogue wording, scenario files and crew-sim batch runs (never published)"
license = "Apache-2.0"
[exports]
modules = ["sunholo/crew_lab/narrative", "sunholo/crew_lab/watch_presenter", "sunholo/crew_lab/native_watch_ui", "sunholo/crew_lab/native_watch_args", "sunholo/crew_lab/native_watch_presenter", "sunholo/crew_lab/dialogue", "sunholo/crew_lab/store", "sunholo/crew_lab/play_flow", "sunholo/crew_lab/play", "sunholo/crew_lab/presenter", "sunholo/crew_lab/journey_flow", "sunholo/crew_lab/ship", "sunholo/crew_lab/crew_sim", "sunholo/crew_lab/reply_jobs", "sunholo/crew_lab/reply_codec", "sunholo/crew_lab/reply_runner", "sunholo/crew_lab/claims", "sunholo/crew_lab/sample"]
[dependencies]
"sunholo/terminal_ui" = {path = "../../packages/terminal-ui"}
"sunholo/social_dynamics" = "0.3.0"
"sunholo/decisions" = "0.4.0"
"sunholo/content_library" = "0.1.0"
"sunholo/crew_core" = {path = "../../packages/crew-core"}
[effects]
max = ["IO", "FS", "Env", "AI", "Process", "Clock"]
[bin]
crew-host = {module = "main", entry = "main", caps = "IO"}
crew-watch = {module = "native_watch", entry = "main", caps = "IO,FS,Env,Process,Clock", run_flags = ["--fs-max-bytes", "16MB", "--process-allowlist", "crew-reply-worker"]}
crew-watch-offline = {module = "native_watch", entry = "offline", caps = "IO,FS,Env,AI,Process,Clock", run_flags = ["--ai-stub", "--fs-max-bytes", "16MB"]}
crew-sample = {module = "sample_cli", entry = "main", caps = "IO,FS,Env,AI", run_flags = ["--ai", "z-ai/glm-5.3-flash", "--fs-max-bytes", "16MB"]}
crew-sample-offline = {module = "sample_cli", entry = "offline", caps = "IO,FS,Env,AI", run_flags = ["--ai-stub", "--fs-max-bytes", "16MB"]}
crew-reply-worker = {module = "reply_worker", entry = "main", caps = "FS,Env,AI", run_flags = ["--ai", "z-ai/glm-5.3-flash", "--fs-max-bytes", "16MB"]}
crew-sim = {module = "sim_cli", entry = "main", caps = "IO,FS,Env", run_flags = ["--bytecode", "--fs-max-bytes", "64MB"]}

[metadata]
ai_summary = "Pure captain/crew host plus OCEAN reactions, numbered controls and bounded GLM dialogue generation with persistent exact-context bundles; offline mode and complete run journals"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/examples/crew-lab"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "feature"
