[package]
name = "sunholo/crew_lab"
version = "0.4.1"
edition = "1"
ailang = ">=0.54.0"
description = "Captain and crew laboratory with personality decisions and a growing dialogue library"
license = "Apache-2.0"
[exports]
modules = ["sunholo/crew_lab/narrative", "sunholo/crew_lab/watch_presenter", "sunholo/crew_lab/native_watch_ui", "sunholo/crew_lab/native_watch_args", "sunholo/crew_lab/native_watch_presenter", "sunholo/crew_lab/dialogue", "sunholo/crew_lab/store", "sunholo/crew_lab/play_flow", "sunholo/crew_lab/play", "sunholo/crew_lab/presenter", "sunholo/crew_lab/journey_flow", "sunholo/crew_lab/ship"]
[dependencies]
"sunholo/terminal_ui" = {path = "../../packages/terminal-ui"}
"sunholo/social_dynamics" = "0.3.0"
"sunholo/decisions" = "0.4.0"
"sunholo/content_library" = "0.1.0"
"sunholo/crew_core" = {path = "../../packages/crew-core"}
[effects]
max = ["IO", "FS", "Env", "AI"]
[bin]
crew-host = {module = "main", entry = "main", caps = "IO"}
crew-watch = {module = "native_watch", entry = "main", caps = "IO,FS,Env,AI", run_flags = ["--ai", "z-ai/glm-5.3-flash", "--fs-max-bytes", "16MB"]}
crew-watch-offline = {module = "native_watch", entry = "offline", caps = "IO,FS,Env,AI", run_flags = ["--ai-stub", "--fs-max-bytes", "16MB"]}

[metadata]
ai_summary = "Pure captain/crew host plus OCEAN reactions, numbered controls and bounded GLM dialogue generation with persistent exact-context bundles; offline mode and complete run journals"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/examples/crew-lab"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"
[stability]
level = "experimental"
[release]
kind = "fix"
