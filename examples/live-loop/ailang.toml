[package]
name = "sunholo/live_loop_lab"
version = "0.1.0"
edition = "1"
ailang = ">=0.54.17"
description = "Local live-loop host feasibility lab: pure revision planner and deterministic audio fixtures; never published"
license = "Apache-2.0"
[exports]
modules = ["sunholo/live_loop_lab/planner", "sunholo/live_loop_lab/assets"]
[dependencies]
"sunholo/audio" = {path = "../../packages/audio"}
[effects]
max = ["IO", "FS"]
[metadata]
license_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
ai_summary = "Local four-part loop instrument study with a pure frame-clock revision planner, bounded commands, epoch/revision checks, deterministic sound assets and separate host audio/capture workers"
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/examples/live-loop"
[stability]
level = "experimental"
[release]
kind = "feature"
